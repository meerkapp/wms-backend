name: Release

on:
  push:
    tags:
      - 'v*'
      - 'contracts-v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/wms-backend

jobs:
  build-and-push:
    if: "!startsWith(github.ref_name, 'contracts-v')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            FRONTEND_URL=https://github.com/meerkapp/wms-frontend/releases/download/${{ github.ref_name }}/meerk-wms-frontend.zip
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-contracts:
    if: "startsWith(github.ref_name, 'contracts-v')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma schemas
        working-directory: .
        run: pnpm prisma generate

      - name: Build
        run: pnpm build

      - name: Resolve package metadata
        id: package
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PUBLISH_TAG="latest"
          if [[ "${PACKAGE_VERSION}" == *-* ]]; then
            PRERELEASE="${PACKAGE_VERSION#*-}"
            PUBLISH_TAG="${PRERELEASE%%.*}"
          fi
          echo "name=${PACKAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "publish_tag=${PUBLISH_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Publish
        run: |
          PACKAGE="${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}"
          if npm view "${PACKAGE}" version --json >/dev/null 2>&1; then
            echo "${PACKAGE} is already published"
          else
            pnpm publish \
              --no-git-checks \
              --access public \
              --tag "${{ steps.package.outputs.publish_tag }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Preserve latest for stable releases
        if: steps.package.outputs.publish_tag != 'latest'
        run: |
          PACKAGE_NAME="${{ steps.package.outputs.name }}"
          PACKAGE_VERSION="${{ steps.package.outputs.version }}"
          PUBLISH_TAG="${{ steps.package.outputs.publish_tag }}"
          npm dist-tag add "${PACKAGE_NAME}@${PACKAGE_VERSION}" "${PUBLISH_TAG}"
          STABLE_VERSION="$(
            npm view "${PACKAGE_NAME}" versions --json |
              node -e "
                let input = '';
                process.stdin.on('data', (chunk) => input += chunk);
                process.stdin.on('end', () => {
                  const stable = JSON.parse(input)
                    .filter((version) => !version.includes('-'))
                    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
                    .at(-1);
                  if (!stable) process.exit(1);
                  process.stdout.write(stable);
                });
              "
          )"
          npm dist-tag add "${PACKAGE_NAME}@${STABLE_VERSION}" latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
